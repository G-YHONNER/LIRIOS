<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Flores y Corazones - Para ti, Diana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *,
    *::after,
    *::before {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --dark-color: #020514;
      --c-main: #ffea00;
      --c-mid: #ff9100;
      --c-back: #ffd600;
      --c-light: #ffff8d;
      --c-glow: rgba(255, 234, 0, 1);
    }

    html,
    body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background: #020514 radial-gradient(circle at 50% 32%, #102048 0%, #081128 48%, #030712 85%, #010208 100%) no-repeat center center fixed;
      background-size: cover;
    }

    body {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      perspective: 1000px;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
    }

    /* Fondo nocturno mejorado y sincronizado con los 24 colores */
    .night {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 32%, #102048 0%, #081128 48%, #030712 85%, #010208 100%);
      pointer-events: none;
    }

    /* Halo de luz ambiental reactivo detrás del jardín */
    .ambient-light {
      position: fixed;
      top: 52%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      width: 58vmin;
      height: 58vmin;
      border-radius: 50%;
      background: radial-gradient(circle, var(--c-glow) 0%, transparent 70%);
      opacity: 0.48;
      pointer-events: none;
      z-index: 1;
      will-change: transform;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      pointer-events: none;
      z-index: 2;
      background: transparent;
    }

    /* Dedicatoria superior para Diana */
    .title-box {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 300;
      width: 92%;
      max-width: 720px;
      pointer-events: none;
    }

    .title-box .dedication-prefix {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: clamp(0.82rem, 2vw, 1.02rem);
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 3px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .title-box h2 {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(2.5rem, 6.8vw, 4rem);
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 0 16px var(--c-glow), 0 0 36px var(--c-glow);
      margin-bottom: 8px;
      transition: text-shadow 0.4s ease;
    }

    .title-box .divider {
      width: 120px;
      height: 1px;
      margin: 0 auto 8px;
      background: linear-gradient(90deg, transparent, var(--c-light), transparent);
      box-shadow: 0 0 10px var(--c-glow);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    /* Reflejo luminoso del suelo bajo el jardín */
    .ground-mist {
      position: fixed;
      bottom: -4vmin;
      left: 50%;
      transform: translate3d(-50%, 0, 0);
      width: 90vmin;
      height: 18vmin;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, var(--c-glow) 0%, rgba(16, 185, 129, 0.22) 48%, transparent 75%);
      filter: blur(22px);
      opacity: 0.65;
      pointer-events: none;
      z-index: 3;
      transition: background 0.45s ease;
      will-change: transform;
    }

    /* ==========================================================================
       JARDÍN DE FLORES Y FOLLAJE (3 FLORES)
       ========================================================================== */
    .flowers {
      position: relative;
      transform: scale(0.9);
      transform-origin: bottom center;
      bottom: -3vmin;
      z-index: 10;
    }

    .flower {
      position: absolute;
      bottom: -2vmin;
      transform-origin: bottom center;
      z-index: 10;
      --fl-speed: 0.8s;
      will-change: transform;
    }

    /* Flor 1: Alta al centro arriba (72vmin) */
    .flower--1 {
      animation: moving-flower-1 4s linear infinite;
    }
    .flower--1 .flower__line {
      height: 72vmin;
      animation-delay: 0.3s;
    }
    .flower--1 .flower__line__leaf--1 {
      animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
    }
    .flower--1 .flower__line__leaf--2 {
      animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
    }
    .flower--1 .flower__line__leaf--3 {
      animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
    }
    .flower--1 .flower__line__leaf--4 {
      animation: blooming-leaf-left var(--fl-speed) 1s backwards;
    }
    .flower--1 .flower__line__leaf--5 {
      animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
    }
    .flower--1 .flower__line__leaf--6 {
      animation: blooming-leaf-left var(--fl-speed) 2s backwards;
    }

    /* Flor 2: Inclinada a la derecha (20deg, 62vmin) */
    .flower--2 {
      left: 50%;
      transform: rotate(20deg);
      animation: moving-flower-2 4s linear infinite;
    }
    .flower--2 .flower__line {
      height: 62vmin;
      animation-delay: 0.6s;
    }
    .flower--2 .flower__line__leaf--1 {
      animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
    }
    .flower--2 .flower__line__leaf--2 {
      animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
    }
    .flower--2 .flower__line__leaf--3 {
      animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
    }
    .flower--2 .flower__line__leaf--4 {
      animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
    }

    /* Flor 3: Inclinada a la izquierda (-15deg, 56vmin) */
    .flower--3 {
      left: 50%;
      transform: rotate(-15deg);
      animation: moving-flower-3 4s linear infinite;
    }
    .flower--3 .flower__line {
      height: 56vmin;
      animation-delay: 0.9s;
    }
    .flower--3 .flower__line__leaf--1 {
      animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
    }
    .flower--3 .flower__line__leaf--2 {
      animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
    }
    .flower--3 .flower__line__leaf--3 {
      animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
    }
    .flower--3 .flower__line__leaf--4 {
      animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
    }

    .flower__leafs {
      position: relative;
      animation: blooming-flower 2s backwards;
    }
    .flower__leafs--1 {
      animation-delay: 1.1s;
    }
    .flower__leafs--2 {
      animation-delay: 1.4s;
    }
    .flower__leafs--3 {
      animation-delay: 1.7s;
    }
    .flower__leafs::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      width: 14vmin;
      height: 14vmin;
      border-radius: 50%;
      background: radial-gradient(circle, var(--f-main, var(--c-main)) 0%, transparent 70%);
      opacity: 0.9;
      pointer-events: none;
    }

    /* Pétalos de las flores con colores ultra intensos y vibrantes */
    .flower__leaf {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 8vmin;
      height: 11vmin;
      border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;
      background-color: var(--f-main, var(--c-main));
      background-image: linear-gradient(
        to top,
        var(--f-mid, var(--c-mid)) 0%,
        var(--f-main, var(--c-main)) 52%,
        var(--f-light, var(--c-light)) 100%
      );
      transform-origin: bottom center;
      opacity: 1;
      filter: saturate(1.35) brightness(1.12);
      box-shadow:
        inset 0 0 1.6vmin var(--f-light, var(--c-light)),
        0 0 3.2vmin var(--f-glow, var(--c-glow)),
        0 0 1.4vmin var(--f-main, var(--c-main));
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }

    .flower__leaf--1 {
      transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
    }
    .flower__leaf--2 {
      transform: translate(-50%, -4%) rotateX(40deg);
    }
    .flower__leaf--3 {
      transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg);
    }
    .flower__leaf--4 {
      width: 8vmin;
      height: 8vmin;
      transform-origin: bottom left;
      border-radius: 4vmin 10vmin 4vmin 4vmin;
      transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg);
      background-image: linear-gradient(
        to top,
        var(--f-mid, var(--c-mid)),
        var(--f-main, var(--c-main)) 60%,
        var(--f-light, var(--c-light))
      );
      z-index: 1;
      opacity: 0.96;
    }

    .flower__white-circle {
      position: absolute;
      left: -3.5vmin;
      top: -3vmin;
      width: 9vmin;
      height: 4vmin;
      border-radius: 50%;
      background-color: #ffffff;
      box-shadow: 0 0 1.5vmin rgba(255, 255, 255, 0.8);
    }

    .flower__white-circle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 60%;
      border-radius: inherit;
      background-image:
        repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.04) 0px, rgba(0, 0, 0, 0.04) 1px, transparent 1px, transparent 12px),
        repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.04) 0px, rgba(0, 0, 0, 0.04) 1px, transparent 1px, transparent 12px),
        linear-gradient(90deg, #ffeb12, #ff9900);
      box-shadow: 0 0 10px #fde047;
    }

    .flower__line {
      height: 56vmin;
      width: 1.5vmin;
      background-image:
        linear-gradient(to left, rgba(0, 0, 0, 0.25), transparent, rgba(255, 255, 255, 0.22)),
        linear-gradient(to top, #022c0f 0%, #056d24 14%, #16a34a 100%);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
      animation: grow-flower-tree 4s backwards;
    }

    .flower__line__leaf {
      --w: 7vmin;
      --h: calc(var(--w) + 2vmin);
      position: absolute;
      top: 20%;
      left: 90%;
      width: var(--w);
      height: var(--h);
      border-top-right-radius: var(--h);
      border-bottom-left-radius: var(--h);
      background-image: linear-gradient(to top, rgba(12, 94, 32, 0.45), #16a34a, #4ade80);
    }

    .flower__line__leaf--1 {
      transform: rotate(70deg) rotateY(30deg);
    }
    .flower__line__leaf--2 {
      top: 45%;
      transform: rotate(70deg) rotateY(30deg);
    }
    .flower__line__leaf--3,
    .flower__line__leaf--4,
    .flower__line__leaf--6 {
      border-top-right-radius: 0;
      border-bottom-left-radius: 0;
      border-top-left-radius: var(--h);
      border-bottom-right-radius: var(--h);
      left: -460%;
      top: 12%;
      transform: rotate(-70deg) rotateY(30deg);
    }
    .flower__line__leaf--4 {
      top: 40%;
    }
    .flower__line__leaf--5 {
      top: 0;
      transform-origin: left;
      transform: rotate(70deg) rotateY(30deg) scale(0.6);
    }
    .flower__line__leaf--6 {
      top: -2%;
      left: -450%;
      transform-origin: right;
      transform: rotate(-70deg) rotateY(30deg) scale(0.6);
    }

    /* Luces mágicas que salen de las flores sincronizadas con el color */
    .flower__light {
      position: absolute;
      bottom: 0vmin;
      width: 1.1vmin;
      height: 1.1vmin;
      background-color: var(--f-light, var(--c-light));
      box-shadow: 0 0 1.4vmin var(--f-main, var(--c-main));
      border-radius: 50%;
      filter: blur(0.12vmin);
      animation: light-ans 4s ease-in-out infinite backwards;
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
    }
    .flower__light:nth-child(odd) {
      background-color: #ffffff;
      box-shadow: 0 0 1.4vmin var(--f-light, var(--c-light));
    }
    .flower__light--1 { left: -2vmin; animation-delay: 1s; }
    .flower__light--2 { left: 3vmin; animation-delay: 0.5s; }
    .flower__light--3 { left: -6vmin; animation-delay: 0.3s; }
    .flower__light--4 { left: 6vmin; animation-delay: 0.9s; }
    .flower__light--5 { left: -1vmin; animation-delay: 1.5s; }
    .flower__light--6 { left: -4vmin; animation-delay: 3s; }
    .flower__light--7 { left: 3vmin; animation-delay: 2s; }
    .flower__light--8 { left: -6vmin; animation-delay: 3.5s; }

    .flower__grass {
      --c: #0d8a3e;
      --line-w: 1.5vmin;
      position: absolute;
      bottom: 12vmin;
      left: -7vmin;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 20;
      transform-origin: bottom center;
      transform: rotate(-48deg) rotateY(40deg);
    }
    .flower__grass--1 {
      animation: moving-grass 2s ease-in-out infinite;
    }
    .flower__grass--2 {
      left: 2vmin;
      bottom: 10vmin;
      transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
      opacity: 0.8;
      z-index: 0;
      animation: moving-grass--2 1.5s ease-in-out infinite;
    }
    .flower__grass--top {
      width: 7vmin;
      height: 10vmin;
      border-top-right-radius: 100%;
      border-right: var(--line-w) solid var(--c);
      transform-origin: bottom center;
      transform: rotate(-2deg);
    }
    .flower__grass--bottom {
      margin-top: -2px;
      width: var(--line-w);
      height: 25vmin;
      background-image: linear-gradient(to top, transparent, var(--c));
    }
    .flower__grass__leaf {
      --size: 10vmin;
      position: absolute;
      width: calc(var(--size) * 2.1);
      height: var(--size);
      border-top-left-radius: var(--size);
      border-top-right-radius: var(--size);
      background-image: linear-gradient(to top, transparent, transparent 30%, var(--c));
      z-index: 100;
    }
    .flower__grass__leaf--1 {
      top: -6%;
      left: 30%;
      --size: 6vmin;
      transform: rotate(-20deg);
      animation: growing-grass-ans--1 2s 2.6s backwards;
    }
    @keyframes growing-grass-ans--1 {
      0% { transform-origin: bottom left; transform: rotate(-20deg) scale(0); }
    }
    .flower__grass__leaf--2 {
      top: -5%;
      left: -110%;
      --size: 6vmin;
      transform: rotate(10deg);
      animation: growing-grass-ans--2 2s 2.4s linear backwards;
    }
    @keyframes growing-grass-ans--2 {
      0% { transform-origin: bottom right; transform: rotate(10deg) scale(0); }
    }
    .flower__grass__leaf--3 {
      top: 5%;
      left: 60%;
      --size: 8vmin;
      transform: rotate(-18deg) rotateX(-20deg);
      animation: growing-grass-ans--3 2s 2.2s linear backwards;
    }
    @keyframes growing-grass-ans--3 {
      0% { transform-origin: bottom left; transform: rotate(-18deg) rotateX(-20deg) scale(0); }
    }
    .flower__grass__leaf--4 {
      top: 6%;
      left: -135%;
      --size: 8vmin;
      transform: rotate(2deg);
      animation: growing-grass-ans--4 2s 2s linear backwards;
    }
    @keyframes growing-grass-ans--4 {
      0% { transform-origin: bottom right; transform: rotate(2deg) scale(0); }
    }
    .flower__grass__leaf--5 {
      top: 20%;
      left: 60%;
      --size: 10vmin;
      transform: rotate(-24deg) rotateX(-20deg);
      animation: growing-grass-ans--5 2s 1.8s linear backwards;
    }
    @keyframes growing-grass-ans--5 {
      0% { transform-origin: bottom left; transform: rotate(-24deg) rotateX(-20deg) scale(0); }
    }
    .flower__grass__leaf--6 {
      top: 22%;
      left: -180%;
      --size: 10vmin;
      transform: rotate(10deg);
      animation: growing-grass-ans--6 2s 1.6s linear backwards;
    }
    @keyframes growing-grass-ans--6 {
      0% { transform-origin: bottom right; transform: rotate(10deg) scale(0); }
    }
    .flower__grass__leaf--7 {
      top: 39%;
      left: 70%;
      --size: 10vmin;
      transform: rotate(-10deg);
      animation: growing-grass-ans--7 2s 1.4s linear backwards;
    }
    @keyframes growing-grass-ans--7 {
      0% { transform-origin: bottom left; transform: rotate(-10deg) scale(0); }
    }
    .flower__grass__leaf--8 {
      top: 40%;
      left: -215%;
      --size: 11vmin;
      transform: rotate(10deg);
      animation: growing-grass-ans--8 2s 1.2s linear backwards;
    }
    @keyframes growing-grass-ans--8 {
      0% { transform-origin: bottom right; transform: rotate(10deg) scale(0); }
    }
    .flower__grass__overlay {
      position: absolute;
      top: -10%;
      right: 0%;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.55);
      filter: blur(1.5vmin);
      z-index: 100;
    }

    .flower__g-long {
      --w: 2vmin;
      --h: 6vmin;
      --c: #0d6632;
      position: absolute;
      bottom: 10vmin;
      left: -3vmin;
      transform-origin: bottom center;
      transform: rotate(-30deg) rotateY(-20deg);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      animation: flower-g-long-ans 3s ease-in-out infinite;
    }
    @keyframes flower-g-long-ans {
      0%, 100% { transform: rotate(-30deg) rotateY(-20deg); }
      50% { transform: rotate(-32deg) rotateY(-20deg); }
    }
    .flower__g-long__top {
      top: calc(var(--h) * -1);
      width: calc(var(--w) + 1vmin);
      height: var(--h);
      border-top-right-radius: 100%;
      border-right: 0.7vmin solid var(--c);
      transform: translate(-0.7vmin, 1vmin);
    }
    .flower__g-long__bottom {
      width: var(--w);
      height: 50vmin;
      transform-origin: bottom center;
      background-image: linear-gradient(to top, transparent 30%, var(--c));
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
      clip-path: polygon(35% 0, 65% 1%, 100% 100%, 0% 100%);
    }

    .flower__g-right {
      position: absolute;
      bottom: 6vmin;
      left: -2vmin;
      transform-origin: bottom left;
      transform: rotate(20deg);
    }
    .flower__g-right .leaf {
      width: 30vmin;
      height: 50vmin;
      border-top-left-radius: 100%;
      border-left: 2vmin solid #028137;
      background-image: linear-gradient(to bottom, transparent, var(--dark-color) 60%);
      -webkit-mask-image: linear-gradient(to top, transparent 30%, #028137 60%);
    }
    .flower__g-right--1 {
      animation: flower-g-right-ans 2.5s ease-in-out infinite;
    }
    .flower__g-right--2 {
      left: 5vmin;
      transform: rotateY(-180deg);
      animation: flower-g-right-ans--2 3s ease-in-out infinite;
    }
    .flower__g-right--2 .leaf {
      height: 75vmin;
      filter: blur(0.3vmin);
      opacity: 0.8;
    }
    @keyframes flower-g-right-ans {
      0%, 100% { transform: rotate(20deg); }
      50% { transform: rotate(24deg) rotateX(-20deg); }
    }
    @keyframes flower-g-right-ans--2 {
      0%, 100% { transform: rotateY(-180deg) rotate(0deg) rotateX(-20deg); }
      50% { transform: rotateY(-180deg) rotate(6deg) rotateX(-20deg); }
    }

    .flower__g-front {
      position: absolute;
      bottom: 6vmin;
      left: 2.5vmin;
      z-index: 100;
      transform-origin: bottom center;
      transform: rotate(-28deg) rotateY(30deg) scale(1.04);
      animation: flower__g-front-ans 2s ease-in-out infinite;
    }
    @keyframes flower__g-front-ans {
      0%, 100% { transform: rotate(-28deg) rotateY(30deg) scale(1.04); }
      50% { transform: rotate(-35deg) rotateY(40deg) scale(1.04); }
    }
    .flower__g-front__line {
      width: 0.3vmin;
      height: 20vmin;
      background-image: linear-gradient(to top, transparent, #028137, transparent 100%);
      position: relative;
    }
    .flower__g-front__leaf-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: bottom left;
      transform: rotate(10deg);
    }
    .flower__g-front__leaf-wrapper:nth-child(even) {
      left: 0vmin;
      transform: rotateY(-180deg) rotate(5deg);
      animation: flower__g-front__leaf-left-ans 1s ease-in backwards;
    }
    .flower__g-front__leaf-wrapper:nth-child(odd) {
      animation: flower__g-front__leaf-ans 1s ease-in backwards;
    }
    .flower__g-front__leaf-wrapper--1 {
      top: -8vmin;
      transform: scale(0.7);
      animation: flower__g-front__leaf-ans 1s 5.5s ease-in backwards !important;
    }
    .flower__g-front__leaf-wrapper--2 {
      top: -8vmin;
      transform: rotateY(-180deg) scale(0.7) !important;
      animation: flower__g-front__leaf-left-ans-2 1s 5.2s ease-in backwards !important;
    }
    .flower__g-front__leaf-wrapper--3 {
      top: -3vmin;
      animation: flower__g-front__leaf-ans 1s 4.9s ease-in backwards !important;
    }
    .flower__g-front__leaf-wrapper--4 {

      <div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--0"></div></div>
      <div class="grow-ans" style="--d:4.4s"><div class="leaf leaf--1"></div></div>
      <div class="grow-ans" style="--d:4.6s"><div class="leaf leaf--2"></div></div>
      <div class="grow-ans" style="--d:4.8s"><div class="leaf leaf--3"></div></div>
    </div>

    <div class="long-g long-g--7">
      <div class="grow-ans" style="--d:3s"><div class="leaf leaf--0"></div></div>
      <div class="grow-ans" style="--d:3.2s"><div class="leaf leaf--1"></div></div>
      <div class="grow-ans" style="--d:3.5s"><div class="leaf leaf--2"></div></div>
      <div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       24 COLORES ULTRA INTENSOS Y VIBRANTES PARA LAS FLORES
       ========================================================================== */
    const COLORS = [
      { name: "Amarillo Sol",    main: "#ffea00", mid: "#ff9100", back: "#ffd600", light: "#ffff8d", glow: "rgba(255, 234, 0, 1)" },
      { name: "Rojo Carmesí",    main: "#ff0044", mid: "#b80028", back: "#e60039", light: "#ff6690", glow: "rgba(255, 0, 68, 1)" },
      { name: "Rosa Intenso",    main: "#ff007f", mid: "#c40058", back: "#e6006b", light: "#ff73b9", glow: "rgba(255, 0, 127, 1)" },
      { name: "Fucsia Neón",     main: "#ff00b7", mid: "#ad007c", back: "#e000a0", light: "#ff80db", glow: "rgba(255, 0, 183, 1)" },
      { name: "Coral Vivo",      main: "#ff2a00", mid: "#b51800", back: "#e02400", light: "#ff8566", glow: "rgba(255, 42, 0, 1)" },
      { name: "Mandarina",       main: "#ff5500", mid: "#ba3600", back: "#e64d00", light: "#ff9d66", glow: "rgba(255, 85, 0, 1)" },
      { name: "Naranja Fuego",   main: "#ff7700", mid: "#c24f00", back: "#eb6b00", light: "#ffb866", glow: "rgba(255, 119, 0, 1)" },
      { name: "Oro Radiante",    main: "#ffc400", mid: "#cc7a00", back: "#ebaa00", light: "#ffe57f", glow: "rgba(255, 196, 0, 1)" },
      { name: "Verde Lima Neón", main: "#aaff00", mid: "#55aa00", back: "#88dd00", light: "#dcff80", glow: "rgba(170, 255, 0, 1)" },
      { name: "Verde Esmeralda", main: "#00ff88", mid: "#00994d", back: "#00cc6a", light: "#80ffc4", glow: "rgba(0, 255, 136, 1)" },
      { name: "Verde Jade Vivo", main: "#00e640", mid: "#008c23", back: "#00c435", light: "#7aff9e", glow: "rgba(0, 230, 64, 1)" },
      { name: "Aguamarina",      main: "#00ffcc", mid: "#00997a", back: "#00cca3", light: "#80ffe6", glow: "rgba(0, 255, 204, 1)" },
      { name: "Turquesa Eléctrico",main:"#00e5ff",mid: "#0088a3", back: "#00b8d4", light: "#84ffff", glow: "rgba(0, 229, 255, 1)" },
      { name: "Azul Cian",       main: "#00b0ff", mid: "#0062a3", back: "#0091ea", light: "#80d8ff", glow: "rgba(0, 176, 255, 1)" },
      { name: "Azul Eléctrico",  main: "#1a66ff", mid: "#0033b8", back: "#004de6", light: "#75aaff", glow: "rgba(26, 102, 255, 1)" },
      { name: "Azul Zafiro",     main: "#294dff", mid: "#0a1f99", back: "#1b3ae0", light: "#829bff", glow: "rgba(41, 77, 255, 1)" },
      { name: "Índigo Intenso",  main: "#5933ff", mid: "#2d00b3", back: "#471ae6", light: "#a68cff", glow: "rgba(89, 51, 255, 1)" },
      { name: "Violeta Vivo",    main: "#8c1aff", mid: "#4d0099", back: "#7300e6", light: "#c68cff", glow: "rgba(140, 26, 255, 1)" },
      { name: "Amatista",        main: "#b300ff", mid: "#660099", back: "#9900db", light: "#da80ff", glow: "rgba(179, 0, 255, 1)" },
      { name: "Púrpura Neón",    main: "#d900ff", mid: "#800099", back: "#bd00de", light: "#ee80ff", glow: "rgba(217, 0, 255, 1)" },
      { name: "Magenta Puro",    main: "#ff0099", mid: "#9e0059", back: "#db0080", light: "#ff75c8", glow: "rgba(255, 0, 153, 1)" },
      { name: "Rosa Rubí",       main: "#ff1a66", mid: "#a80038", back: "#e00b52", light: "#ff80ab", glow: "rgba(255, 26, 102, 1)" },
      { name: "Blanco Diamante", main: "#ffffff", mid: "#70b5ff", back: "#cce6ff", light: "#ffffff", glow: "rgba(255, 255, 255, 1)" },
      { name: "Rojo Rubí",       main: "#ff002b", mid: "#990014", back: "#d90022", light: "#ff7088", glow: "rgba(255, 0, 43, 1)" }
    ];

    let index = 23; // Inicia con los colores de tu ramo: Flor centro Roja, Flor derecha Rosa, Flor izquierda Mandarina
    const root = document.documentElement.style;
    const flowerNodes = document.querySelectorAll(".flower");

    function applyFlowerPalette() {
      const c = COLORS[index];
      root.setProperty("--c-main", c.main);
      root.setProperty("--c-mid", c.mid);
      root.setProperty("--c-back", c.back);
      root.setProperty("--c-light", c.light);
      root.setProperty("--c-glow", c.glow);

      flowerNodes.forEach((fl, i) => {
        // Modo Ramo Multicolor permanente: cada flor toma un color armónico distinto de los 24
        const fc = COLORS[(index + i * 3) % COLORS.length];
        fl.style.setProperty("--f-main", fc.main);
        fl.style.setProperty("--f-mid", fc.mid);
        fl.style.setProperty("--f-light", fc.light);
        fl.style.setProperty("--f-glow", fc.glow);
      });
    }

    function updateGardenColor(newIndex) {
      index = (newIndex + COLORS.length) % COLORS.length;
      applyFlowerPalette();
    }

    // Cambiar combinación de colores al presionar cualquier parte de la pantalla (Touch y Clic)
    let lastInteraction = 0;
    function handleTapOrClick(clientX, clientY) {
      const now = performance.now();
      if (now - lastInteraction < 200) return;
      lastInteraction = now;

      if (clientX < window.innerWidth * 0.35) {
        updateGardenColor(index - 1);
      } else {
        updateGardenColor(index + 1);
      }
      createSparkles(clientX, clientY, 34);
    }

    window.addEventListener("click", (e) => {
      handleTapOrClick(e.clientX, e.clientY);
    });

    window.addEventListener("touchend", (e) => {
      if (e.changedTouches && e.changedTouches[0]) {
        handleTapOrClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") updateGardenColor(index - 1);
      if (e.key === "ArrowRight") updateGardenColor(index + 1);
    });

    // Bloqueo total de zoom en pantalla para móviles (gestos, pellizcos y doble toque)
    document.addEventListener("touchstart", (e) => {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener("touchmove", (e) => {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    let lastTap = 0;
    document.addEventListener("touchend", (e) => {
      const now = performance.now();
      if (now - lastTap < 300) {
        e.preventDefault();
      }
      lastTap = now;
    }, { passive: false });

    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.addEventListener("gesturechange", (e) => e.preventDefault());
    document.addEventListener("gestureend", (e) => e.preventDefault());

    /* ==========================================================================
       CANVAS NOCTURNO, LUCIÉRNAGAS Y MARIPOSAS DE LUZ A 120HZ
       ========================================================================== */
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);

    function resizeCanvas() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);

    const particles = [];
    const bgStars = [];
    const fireflies = [];
    const butterflies = [];

    for (let i = 0; i < 95; i++) {
      bgStars.push({
        x: Math.random() * w,
        y: Math.random() * (h * 0.78),
        r: Math.random() * 1.4 + 0.3,
        alpha: Math.random(),
        da: (Math.random() * 0.015 + 0.004) * (Math.random() < 0.5 ? 1 : -1)
      });
    }

    // Luciérnagas mágicas que ascienden desde el jardín
    for (let i = 0; i < 32; i++) {
      fireflies.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2.3 + 0.9,
        alpha: Math.random() * 0.8 + 0.2,
        vy: -(Math.random() * 0.45 + 0.15),
        vx: (Math.random() - 0.5) * 0.35,
        angle: Math.random() * Math.PI * 2,
        colorOffset: i * 2
      });
    }

    // 4 Mariposas luminosas que revolotean suavemente sobre las flores a 120Hz
    for (let i = 0; i < 4; i++) {
      butterflies.push({
        x: w * (0.28 + i * 0.15),
        y: h * (0.45 + (i % 2) * 0.12),
        baseY: h * (0.42 + (i % 2) * 0.14),
        vx: (i % 2 === 0 ? 1 : -1) * (0.65 + i * 0.12),
        phase: i * 1.7,
        wingAngle: Math.random() * Math.PI * 2,
        size: 8 + (i % 2) * 2.5,
        colorOffset: i * 4
      });
    }

    function createSparkles(x, y, count = 16) {
      if (particles.length > 36) particles.splice(0, particles.length - 20);
      const c = COLORS[index];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.4 + 0.8;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.5,
          r: Math.random() * 2.4 + 0.9,
          alpha: 1,
          decay: Math.random() * 0.025 + 0.015,
          color: i % 2 === 0 ? c.light : c.main
        });
      }
    }

    // Rastro de polvo estelar suave y optimizado
    let lastTrail = 0;
    function handlePointerMove(x, y) {
      const now = performance.now();
      if (now - lastTrail > 28) {
        lastTrail = now;
        if (particles.length > 45) return;
        const c = COLORS[index];
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8 - 0.25,
          r: Math.random() * 1.8 + 0.7,
          alpha: 0.8,
          decay: 0.03,
          color: Math.random() < 0.5 ? c.light : "#ffffff"
        });
      }
    }

    window.addEventListener("mousemove", (e) => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener("touchmove", (e) => {
      if (e.touches && e.touches[0]) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    let lastFrameTime = performance.now();

    function animate(now = performance.now()) {
      const rawDt = now - lastFrameTime;
      const dt = Math.min(32, Math.max(1, rawDt));
      const step = dt / 16.6667;
      lastFrameTime = now;

      ctx.clearRect(0, 0, w, h);
      const c = COLORS[index];

      // 1. Estrellas del cielo titilando
      for (let i = 0; i < bgStars.length; i++) {
        const s = bgStars[i];
        s.alpha += s.da * step;
        if (s.alpha > 0.95 || s.alpha < 0.15) s.da *= -1;

        ctx.globalAlpha = Math.max(0.1, Math.min(1, s.alpha));
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Luciérnagas multicolor flotando entre las hojas (Aceleradas por hardware)
      for (let i = 0; i < fireflies.length; i++) {
        const f = fireflies[i];
        f.angle += 0.022 * step;
        f.y += f.vy * step;
        f.x += (Math.sin(f.angle) * 0.38 + f.vx) * step;

        if (f.y < -15) {
          f.y = h + 15;
          f.x = Math.random() * w;
        }

        const fc = COLORS[(index + f.colorOffset) % COLORS.length];

        // Resplandor exterior suave
        ctx.globalAlpha = f.alpha * 0.35;
        ctx.fillStyle = fc.main;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r * 2.6, 0, Math.PI * 2);
        ctx.fill();

        // Núcleo luminoso brillante
        ctx.globalAlpha = f.alpha;
        ctx.fillStyle = fc.light;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 3. Mariposas de luz revoloteando (Sin bloqueos de GPU)
      for (let i = 0; i < butterflies.length; i++) {
        const b = butterflies[i];
        b.phase += 0.016 * step;
        b.wingAngle += 0.22 * step;
        b.x += b.vx * step;
        b.y = b.baseY + Math.sin(b.phase) * 34 + Math.cos(b.phase * 0.6) * 14;

        if (b.x > w + 40) b.x = -40;
        if (b.x < -40) b.x = w + 40;

        const bc = COLORS[(index + b.colorOffset) % COLORS.length];
        const wingFlap = Math.abs(Math.sin(b.wingAngle)) * 0.85 + 0.15;
        const dir = b.vx >= 0 ? 1 : -1;

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(Math.sin(b.phase) * 0.18 * dir);

        // Resplandor de mariposa
        ctx.globalAlpha = 0.32;
        ctx.fillStyle = bc.main;
        ctx.beginPath();
        ctx.ellipse(-2 * dir, -b.size * 0.45 * wingFlap, b.size * 1.15, b.size * 0.75 * wingFlap, -0.35 * dir, 0, Math.PI * 2);
        ctx.fill();

        // Ala superior brillante
        ctx.globalAlpha = 0.92;
        ctx.fillStyle = bc.light;
        ctx.beginPath();
        ctx.ellipse(-2 * dir, -b.size * 0.45 * wingFlap, b.size * 0.85, b.size * 0.55 * wingFlap, -0.35 * dir, 0, Math.PI * 2);
        ctx.fill();

        // Ala inferior
        ctx.beginPath();
        ctx.ellipse(-4 * dir, b.size * 0.35 * wingFlap, b.size * 0.65, b.size * 0.42 * wingFlap, 0.35 * dir, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 4. Destellos interactivos de alto rendimiento
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * step;
        p.y += p.vy * step;
        p.vy += 0.04 * step;
        p.alpha -= p.decay * step;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        // Halo suave
        ctx.globalAlpha = p.alpha * 0.38;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Núcleo brillante
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    // Al cargar: quita la clase "container" para iniciar el florecimiento tal como hacía main.js
    window.onload = () => {
      document.body.classList.remove("container");
      updateGardenColor(23);
      lastFrameTime = performance.now();
      animate();
    };
  </script>
</body>
